<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>RealiArte 1922</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1410">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/aframe.min.js"></script>
</head>
<body>
  <a-scene id="cena" renderer="colorManagement: true; antialias: true"
           cursor="rayOrigin: mouse" raycaster="objects: .clicavel; far: 30"
           vr-mode-ui="enabled: false" loading-screen="backgroundColor: #1a1410">

    <a-entity id="sala"></a-entity>

    <a-entity id="rig" position="0 0 5" movimento>
      <a-entity id="camera" camera="fov: 70" look-controls="touchEnabled: true; magicWindowTrackingEnabled: true" position="0 1.6 0"></a-entity>
    </a-entity>
  </a-scene>

  <!-- Tela inicial -->
  <div id="intro" class="intro">
    <div class="intro-card">
      <p class="intro-ano">1922 · 2022</p>
      <h1>RealiArte 1922</h1>
      <p>Uma sala de museu em 360° com obras ligadas à <strong>Semana de Arte Moderna</strong>.</p>
      <ul>
        <li>Gire o celular (ou arraste a tela) para olhar ao redor.</li>
        <li>Use o joystick para caminhar.</li>
        <li>Aproxime-se de um quadro e toque nele.</li>
        <li>Toque no letreiro da parede central.</li>
      </ul>
      <button id="btn-entrar">Entrar na exposição</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hud" hidden>
    <div id="dica" class="dica" hidden></div>
    <div id="joy" class="joy"><div id="joy-knob" class="joy-knob"></div></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <!-- Painel de informações -->
  <div id="painel" class="painel" hidden role="dialog" aria-modal="true">
    <div class="painel-card">
      <button id="painel-fechar" class="painel-fechar" aria-label="Fechar">×</button>
      <p id="painel-etiqueta" class="etiqueta"></p>
      <h2 id="painel-titulo"></h2>
      <p id="painel-sub" class="sub"></p>
      <div id="painel-corpo"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
